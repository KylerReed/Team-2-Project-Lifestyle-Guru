<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Meal - Lifestyle Guru</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="phone-screen" style="justify-content: flex-start; padding: 25px 20px;">

        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div class="icons">
                <img src="{{ url_for('static', filename='wifi.png') }}" alt="Wi-Fi">
                <img src="{{ url_for('static', filename='battery.png') }}" alt="Battery">
            </div>
        </div>

        <!-- Back Arrow -->
        <a href="{{ url_for('dashboard') }}" class="back-arrow" style="top: 45px;">←</a>

        <!-- Header Title & Notification Icon -->
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 30px; margin-bottom: 20px; position: relative;">
            <h2 style="font-size: 18px; font-weight: 700; margin: 0 auto; color: #000000;">Log meal</h2>
            <div style="background: #FFF3CD; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: absolute; right: 0;">
                <img src="{{ url_for('static', filename='bell.png') }}" alt="Notification Bell" style="width: 18px; height: 18px; object-fit: contain;">
            </div>
        </div>

        <!-- Logo Container -->
        <div class="logo-container" style="width: 130px; height: 130px; margin: 25px auto 20px auto; display: flex; justify-content: center; align-items: center;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>

        <!-- Heading -->
        <h1 class="main-title" style="font-size: 22px; margin-bottom: 30px; color: #000000; text-align: center; line-height: 1.3;">How would you like to log your meal?</h1>

        <div style="width: 100%; display: flex; flex-direction: column; gap: 15px;">
            
            <!-- Food Library Option Card -->
            <a href="{{ url_for('food_library') }}" style="text-decoration: none; color: inherit;">
                <div style="background: #ffffff; border: 1.5px solid #E0E0E0; border-radius: 16px; padding: 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.03); position: relative; overflow: hidden;">
                    <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background-color: #CDE26D;"></div>
                    <div style="padding-left: 10px; font-size: 16px; font-weight: 600; color: #000000; line-height: 1.4;">
                        Select item from<br>Food Library?
                    </div>
                    <span style="font-size: 20px; color: #666666; font-weight: bold; margin-right: 5px;">›</span>
                </div>
            </a>

            <!-- Add New Item Option Card -->
            <a href="{{ url_for('add_food') }}" style="text-decoration: none; color: inherit;">
                <div style="background: #ffffff; border: 1.5px solid #E0E0E0; border-radius: 16px; padding: 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.03); position: relative; overflow: hidden;">
                    <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background-color: #CDE26D;"></div>
                    <div style="padding-left: 10px; font-size: 16px; font-weight: 600; color: #000000;">
                        Add new item
                    </div>
                    <span style="font-size: 20px; color: #666666; font-weight: bold; margin-right: 5px;">›</span>
                </div>
            </a>

        </div>

        <!-- Bottom Navigation Bar -->
         <div class="bottom-nav">
            <a href="{{ url_for('dashboard') }}"><img src="{{ url_for('static', filename='home.png') }}" alt="Home" class="nav-icon"></a>
            <a href="{{ url_for('profile') }}"><img src="{{ url_for('static', filename='user-3.png') }}" alt="Profile" class="nav-icon"></a>
            <a href="{{ url_for('food_library') }}"><img src="{{ url_for('static', filename='hat-chef.png') }}" alt="Chef" class="nav-icon"></a>
        </div>

    </div>

</body>
</html>
