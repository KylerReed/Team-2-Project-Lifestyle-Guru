<!-- templates/height.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Height - Lifestyle Guru</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="phone-screen login-bg">

        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div class="icons">
                <img src="{{ url_for('static', filename='wifi.png') }}" alt="Wi-Fi">
                <img src="{{ url_for('static', filename='battery.png') }}" alt="Battery">
            </div>
        </div>

        <!-- Back Arrow -->
        <a href="{{ url_for('gender') }}" class="back-arrow">←</a>

        <!-- Logo -->
        <div class="logo-container" style="width: 110px; height: 110px; margin-top: 80px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>

        <!-- Heading -->
        <h1 class="main-title" style="font-size: 22px; height: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: #000000; text-align: center;">What’s your current height?</h1>

        <!-- Unit Toggles (Cm / Inch) -->
        <div class="unit-toggle-container" style="margin-bottom: 25px;">
            <button type="button" class="unit-btn active" id="cmBtn" onclick="setUnit('Cm')">Cm</button>
            <button type="button" class="unit-btn" id="inchBtn" onclick="setUnit('Inch')">Inch</button>
        </div>

        <!-- Form with Type-in Input Field -->
        <form id="heightForm" action="{{ url_for('height') }}" method="POST" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            
            <div class="height-output-card" style="background: #ffffff; width: 100%; max-width: 310px; padding: 20px; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px;">
                <input type="number" name="height_value" id="heightInput" value="168" min="100" max="230" step="0.01" required style="font-size: 36px; font-weight: bold; color: #9ACd32; border: none; outline: none; background: transparent; text-align: center; width: 120px;">
                <span id="unitLabel" style="font-size: 36px; font-weight: bold; color: #9ACd32; margin-left: 5px;">cm</span>
            </div>
            <input type="hidden" name="height_unit" id="heightUnitInput" value="cm">

            <!-- Continue Button -->
            <button type="submit" class="continue-btn" style="background-color: #8F8E8E; color: #ffffff; padding: 14px 50px; font-size: 16px; border-radius: 25px; border: none; cursor: pointer; margin-top: 15px;">Continue</button>
        </form>
        
        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="#"><img src="{{ url_for('static', filename='home.png') }}" alt="Home" class="nav-icon"></a>
            <a href="#"><img src="{{ url_for('static', filename='user-3.png') }}" alt="Profile" class="nav-icon"></a>
            <a href="#"><img src="{{ url_for('static', filename='hat-chef.png') }}" alt="Chef" class="nav-icon"></a>
        </div>

    </div>

    <!-- JavaScript to handle unit switching label updates -->
    <script>
        const unitLabel = document.getElementById('unitLabel');
        const heightInput = document.getElementById('heightInput');
        const heightUnitInput = document.getElementById('heightUnitInput');
        const heightForm = document.getElementById('heightForm');

        const limits = {
            Cm: { min: 100, max: 230, label: 'cm', formValue: 'cm' },
            Inch: { min: 39.37, max: 90.55, label: 'in', formValue: 'in' }
        };

        // Form controls can be restored by browser history.  Start from the
        // restored hidden value so the highlight, label, and submitted unit
        // always describe the same display value.
        let currentUnit = heightUnitInput.value === 'in' ? 'Inch' : 'Cm';
        let heightCm = Number(heightInput.value) * (currentUnit === 'Inch' ? 2.54 : 1);

        function currentDisplayHeight() {
            return currentUnit === 'Cm' ? heightCm : heightCm / 2.54;
        }

        function saveDisplayedHeight() {
            const value = Number(heightInput.value);
            const limit = limits[currentUnit];

            if (!Number.isFinite(value) || value < limit.min || value > limit.max) {
                return false;
            }

            heightCm = currentUnit === 'Cm' ? value : value * 2.54;
            return true;
        }

        function syncHeightDisplay() {
            const limit = limits[currentUnit];
            const roundedValue = Math.round(currentDisplayHeight() * 100) / 100;

            document.getElementById('cmBtn').classList.toggle('active', currentUnit === 'Cm');
            document.getElementById('inchBtn').classList.toggle('active', currentUnit === 'Inch');
            unitLabel.innerText = limit.label;
            heightInput.min = limit.min;
            heightInput.max = limit.max;
            heightInput.value = roundedValue;
            heightUnitInput.value = limit.formValue;
        }
        
        function setUnit(unit) {
            if (!limits[unit]) {
                return;
            }

            if (!saveDisplayedHeight()) {
                heightInput.reportValidity();
                return;
            }

            currentUnit = unit;
            syncHeightDisplay();
        }

        heightInput.addEventListener('input', () => {
            if (heightInput.validity.valid) {
                saveDisplayedHeight();
            }
        });

        heightForm.addEventListener('submit', event => {
            if (!saveDisplayedHeight()) {
                event.preventDefault();
                heightInput.reportValidity();
            }
        });

        syncHeightDisplay();
    </script>

</body>
</html>
