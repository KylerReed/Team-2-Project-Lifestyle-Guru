<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Library - Lifestyle Guru</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="phone-screen" style="justify-content: flex-start; padding: 25px 20px;">

        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div class="icons">
                <img src="{{ url_for('static', filename='wifi.png') }}" alt="Wi-Fi">
                <img src="{{ url_for('static', filename='battery.png') }}" alt="Battery">
            </div>
        </div>

        <!-- Back Arrow -->
        <a href="{{ url_for('log_meal') }}" class="back-arrow" style="top: 45px;">←</a>

        <!-- Header Title & Notification Icon -->
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 30px; margin-bottom: 15px; position: relative;">
            <h2 style="font-size: 18px; font-weight: 700; margin: 0 auto; color: #000000;">Food Library</h2>
            <div style="background: #FFF3CD; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: absolute; right: 0;">
                <img src="{{ url_for('static', filename='bell.png') }}" alt="Notification Bell" style="width: 18px; height: 18px; object-fit: contain;">
            </div>
        </div>

        <!-- Search Bar -->
        <div style="width: 100%; margin-bottom: 15px; position: relative;">
            <input type="text" id="searchInput" placeholder="Search food..." oninput="filterAndSortFoods()" style="width: 100%; padding: 12px 40px 12px 16px; border: 1.5px solid #E0E0E0; border-radius: 16px; outline: none; font-size: 14px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.02); box-sizing: border-box;">
            <img src="{{ url_for('static', filename='search.png') }}" alt="Search" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; object-fit: contain; opacity: 0.6;">
        </div>

        <!-- Filter/Sort Buttons Row -->
        <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; gap: 8px;">
            <button type="button" class="filter-btn" onclick="setFilterMode('az', this)" style="flex: 1; padding: 10px 0; background: #F5F5F5; border: 1.5px solid #E0E0E0; border-radius: 14px; font-size: 12px; font-weight: 600; color: #333; cursor: pointer; transition: all 0.2s;">A-Z</button>
            <button type="button" class="filter-btn" onclick="setFilterMode('za', this)" style="flex: 1; padding: 10px 0; background: #F5F5F5; border: 1.5px solid #E0E0E0; border-radius: 14px; font-size: 12px; font-weight: 600; color: #333; cursor: pointer; transition: all 0.2s;">Z-A</button>
            <button type="button" class="filter-btn active" onclick="setFilterMode('favorites', this)" style="flex: 1; padding: 10px 0; background: #CDE26D; border: 1.5px solid #CDE26D; border-radius: 14px; font-size: 12px; font-weight: 600; color: #000; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: all 0.2s;">Favorites</button>
            <button type="button" class="filter-btn" onclick="setFilterMode('common', this)" style="flex: 1.1; padding: 10px 0; background: #F5F5F5; border: 1.5px solid #E0E0E0; border-radius: 14px; font-size: 11px; font-weight: 600; color: #333; cursor: pointer; transition: all 0.2s;">Most Common</button>
        </div>

        <!-- Scrollable Food List Container -->
        <div id="foodListContainer" style="width: 100%; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; padding-bottom: 70px; scrollbar-width: none;">
            
            <!-- Food Card 1 -->
            <div class="food-card" data-name="Avocado Dish" data-favorite="true" data-common="8" style="background: #ffffff; border: 1.5px solid #E0E0E0; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 4px 10px rgba(0,0,0,0.02);">
                <div>
                    <div style="font-size: 16px; font-weight: 700; color: #000; margin-bottom: 2px;">Avocado Dish</div>
                    <div style="font-size: 12px; color: #8F8E8E; margin-bottom: 4px;">Breakfast</div>
                    <div style="font-size: 12px; color: #333; font-weight: 500;">350 Kcal/ P:15g/F:20g/C:30g</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="{{ url_for('static', filename='heart.png') }}" alt="Favorite" class="heart-icon" onclick="toggleFavorite(this)" style="width: 18px; height: 18px; cursor: pointer; object-fit: contain; filter: none;">
                    <img src="{{ url_for('static', filename='pencil.png') }}" alt="Edit" style="width: 16px; height: 16px; cursor: pointer; object-fit: contain; opacity: 0.7;">
                </div>
            </div>

            <!-- Food Card 2 -->
            <div class="food-card" data-name="Chicken" data-favorite="false" data-common="15" style="background: #ffffff; border: 1.5px solid #E0E0E0; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 4px 10px rgba(0,0,0,0.02);">
                <div>
                    <div style="font-size: 16px; font-weight: 700; color: #000; margin-bottom: 2px;">Chicken</div>
                    <div style="font-size: 12px; color: #8F8E8E; margin-bottom: 4px;">Lunch</div>
                    <div style="font-size: 12px; color: #333; font-weight: 500;">350 Kcal/ P:15g/F:20g/C:30g</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="{{ url_for('static', filename='heart.png') }}" alt="Favorite" class="heart-icon" onclick="toggleFavorite(this)" style="width: 18px; height: 18px; cursor: pointer; object-fit: contain; opacity: 0.3;">
                    <img src="{{ url_for('static', filename='pencil.png') }}" alt="Edit" style="width: 16px; height: 16px; cursor: pointer; object-fit: contain; opacity: 0.7;">
                </div>
            </div>

            <!-- Food Card 3 -->
            <div class="food-card" data-name="Boiled eggs" data-favorite="true" data-common="12" style="background: #ffffff; border: 1.5px solid #E0E0E0; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 4px 10px rgba(0,0,0,0.02);">
                <div>
                    <div style="font-size: 16px; font-weight: 700; color: #000; margin-bottom: 2px;">Boiled eggs</div>
                    <div style="font-size: 12px; color: #8F8E8E; margin-bottom: 4px;">Breakfast</div>
                    <div style="font-size: 12px; color: #333; font-weight: 500;">350 Kcal/ P:15g/F:20g/C:30g</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="{{ url_for('static', filename='heart.png') }}" alt="Favorite" class="heart-icon" onclick="toggleFavorite(this)" style="width: 18px; height: 18px; cursor: pointer; object-fit: contain; filter: none;">
                    <img src="{{ url_for('static', filename='pencil.png') }}" alt="Edit" style="width: 16px; height: 16px; cursor: pointer; object-fit: contain; opacity: 0.7;">
                </div>
            </div>

            <!-- Food Card 4 -->
            <div class="food-card" data-name="Mushroom Soup" data-favorite="false" data-common="4" style="background: #ffffff; border: 1.5px solid #E0E0E0; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 4px 10px rgba(0,0,0,0.02);">
                <div>
                    <div style="font-size: 16px; font-weight: 700; color: #000; margin-bottom: 2px;">Mushroom Soup</div>
                    <div style="font-size: 12px; color: #8F8E8E; margin-bottom: 4px;">Dinner</div>
                    <div style="font-size: 12px; color: #333; font-weight: 500;">350 Kcal/ P:15g/F:20g/C:30g</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="{{ url_for('static', filename='heart.png') }}" alt="Favorite" class="heart-icon" onclick="toggleFavorite(this)" style="width: 18px; height: 18px; cursor: pointer; object-fit: contain; opacity: 0.3;">
                    <img src="{{ url_for('static', filename='pencil.png') }}" alt="Edit" style="width: 16px; height: 16px; cursor: pointer; object-fit: contain; opacity: 0.7;">
                </div>
            </div>

            <!-- Food Card 5 -->
            <div class="food-card" data-name="Apple" data-favorite="true" data-common="20" style="background: #ffffff; border: 1.5px solid #E0E0E0; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 4px 10px rgba(0,0,0,0.02);">
                <div>
                    <div style="font-size: 16px; font-weight: 700; color: #000; margin-bottom: 2px;">Apple</div>
                    <div style="font-size: 12px; color: #8F8E8E; margin-bottom: 4px;">Snack</div>
                    <div style="font-size: 12px; color: #333; font-weight: 500;">350 Kcal/ P:15g/F:20g/C:30g</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="{{ url_for('static', filename='heart.png') }}" alt="Favorite" class="heart-icon" onclick="toggleFavorite(this)" style="width: 18px; height: 18px; cursor: pointer; object-fit: contain; filter: none;">
                    <img src="{{ url_for('static', filename='pencil.png') }}" alt="Edit" style="width: 16px; height: 16px; cursor: pointer; object-fit: contain; opacity: 0.7;">
                </div>
            </div>

        </div>

        <!-- Floating Add Button -->
        <a href="{{ url_for('add_food') }}" class="floating-add-btn">+</a>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="{{ url_for('dashboard') }}"><img src="{{ url_for('static', filename='home.png') }}" alt="Home" class="nav-icon"></a>
            <a href="{{ url_for('profile') }}"><img src="{{ url_for('static', filename='user-3.png') }}" alt="Profile" class="nav-icon"></a>
            <a href="{{ url_for('food_library') }}"><img src="{{ url_for('static', filename='hat-chef.png') }}" alt="Chef" class="nav-icon"></a>
        </div>

    </div>

    <!-- JavaScript for Live Filtering, Sorting, and Heart Toggling -->
    <script>
        let currentFilter = 'favorites';

        function setFilterMode(mode, selectedBtn) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.style.background = '#F5F5F5';
                btn.style.borderColor = '#E0E0E0';
                btn.style.boxShadow = 'none';
                btn.style.color = '#333';
                btn.classList.remove('active');
            });
            selectedBtn.style.background = '#CDE26D';
            selectedBtn.style.borderColor = '#CDE26D';
            selectedBtn.style.boxShadow = '0 2px 5px rgba(0,0,0,0.05)';
            selectedBtn.style.color = '#000';
            selectedBtn.classList.add('active');

            currentFilter = mode;
            filterAndSortFoods();
        }

        function toggleFavorite(heartImg) {
            const card = heartImg.closest('.food-card');
            const isFav = card.getAttribute('data-favorite') === 'true';
            
            if (isFav) {
                card.setAttribute('data-favorite', 'false');
                heartImg.style.opacity = '0.3';
            } else {
                card.setAttribute('data-favorite', 'true');
                heartImg.style.opacity = '1';
            }

            if (currentFilter === 'favorites') {
                filterAndSortFoods();
            }
        }

        function filterAndSortFoods() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('foodListContainer');
            const cards = Array.from(container.getElementsByClassName('food-card'));

            // Filter cards
            cards.forEach(card => {
                const name = card.getAttribute('data-name').toLowerCase();
                const isFavorite = card.getAttribute('data-favorite') === 'true';
                
                let matchesSearch = name.includes(searchQuery);
                let matchesFilter = true;

                if (currentFilter === 'favorites') {
                    matchesFilter = isFavorite;
                }

                if (matchesSearch && matchesFilter) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });

            // Sort visible cards
            let visibleCards = cards.filter(card => card.style.display !== 'none');

            visibleCards.sort((a, b) => {
                const nameA = a.getAttribute('data-name').toLowerCase();
                const nameB = b.getAttribute('data-name').toLowerCase();
                const commonA = parseInt(a.getAttribute('data-common'));
                const commonB = parseInt(b.getAttribute('data-common'));

                if (currentFilter === 'az') {
                    return nameA.localeCompare(nameB);
                } else if (currentFilter === 'za') {
                    return nameB.localeCompare(nameA);
                } else if (currentFilter === 'common') {
                    return commonB - commonA;
                }
                return 0;
            });

            // Re-append sorted cards
            visibleCards.forEach(card => container.appendChild(card));
        }

        // Run initial filter on page load
        filterAndSortFoods();
    </script>

</body>
</html>
