<!-- templates/gender.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Gender - Lifestyle Guru</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="phone-screen">

        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div class="icons">
                <img src="{{ url_for('static', filename='wifi.png') }}" alt="Wi-Fi">
                <img src="{{ url_for('static', filename='battery.png') }}" alt="Battery">
            </div>
        </div>

        <!-- Back Arrow -->
        <a href="{{ url_for('weight') }}" class="back-arrow">←</a>

        <!-- Logo Shifted Up Higher -->
        <div class="logo-container" style="width: 120px; height: 120px; margin-bottom: 5px; margin-top: -70px;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        </div>

        <!-- Heading -->
        <h1 class="main-title" style="font-size: 24px; margin-bottom: 20px; color: #000000;">What’s your gender?</h1>

        <!-- Form with Selection Cards -->
        <form action="{{ url_for('height') }}" method="POST" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            
            <div class="gender-options-container" style="width: 100%; max-width: 310px; display: flex; flex-direction: column; gap: 15px;">
                
                <!-- Female Option -->
                <label class="gender-card active" onclick="selectGender(this, 'Female')">
                    <span>Female</span>
                    <input type="radio" name="gender" value="Female" checked style="display: none;">
                    <div class="radio-circle"></div>
                </label>

                <!-- Male Option -->
                <label class="gender-card" onclick="selectGender(this, 'Male')">
                    <span>Male</span>
                    <input type="radio" name="gender" value="Male" style="display: none;">
                    <div class="radio-circle"></div>
                </label>

                <!-- Other Option -->
                <label class="gender-card" onclick="selectGender(this, 'Other')">
                    <span>Other</span>
                    <input type="radio" name="gender" value="Other" style="display: none;">
                    <div class="radio-circle"></div>
                </label>

            </div>

            <!-- Continue Button -->
            <button type="submit" class="continue-btn" style="background-color: #8F8E8E; color: #ffffff; padding: 14px 50px; font-size: 16px; border-radius: 25px; margin-top: 25px; border: none; cursor: pointer;">Continue</button>
        </form>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="#"><img src="{{ url_for('static', filename='home.png') }}" alt="Home" class="nav-icon"></a>
            <a href="#"><img src="{{ url_for('static', filename='user-3.png') }}" alt="Profile" class="nav-icon"></a>
            <a href="#"><img src="{{ url_for('static', filename='hat-chef.png') }}" alt="Chef" class="nav-icon"></a>
        </div>

    </div>

    <!-- JavaScript to handle card active state switching -->
    <script>
        function selectGender(selectedCard, value) {
            document.querySelectorAll('.gender-card').forEach(card => {
                card.classList.remove('active');
            });
            selectedCard.classList.add('active');
        }
    </script>

</body>
</html>
