<!-- templates/age.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Age - Lifestyle Guru</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="phone-screen">

        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div class="icons">
                <img src="{{ url_for('static', filename='wifi.png') }}" alt="Wi-Fi">
                <img src="{{ url_for('static', filename='battery.png') }}" alt="Battery">
            </div>
        </div>

        <!-- Back Arrow -->
        <a href="{{ url_for('login') }}" class="back-arrow">←</a>

        <!-- Standardized Logo (Matches all screens) -->
        <div class="logo-container" style="width: 110px; height: 110px; margin-top: 5px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>

        <!-- Standardized Heading (Matches all screens) -->
        <h1 class="main-title" style="font-size: 22px; height: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; color: #000000; text-align: center;">What’s your Age?</h1>

        <!-- Scrollable Age Picker Wheel -->
        <div class="picker-wheel-container" id="ageWheel">
            <div style="height: 80px;"></div>

            {% for age_val in range(10, 101) %}
                <div class="picker-item {% if age_val == 19 %}active{% endif %}" data-value="{{ age_val }}">
                    {{ age_val }}
                </div>
            {% endfor %}

            <div style="height: 80px;"></div>
        </div>

        <!-- Form / Continue Button -->
        <form action="{{ url_for('age') }}" method="POST" style="width: 100%; display: flex; justify-content: center; z-index: 10; margin-top: 10px;">
            <input type="hidden" name="selected_age" id="selectedAgeInput" value="19">
            <button type="submit" class="continue-btn" style="background-color: #8F8E8E; color: #ffffff; padding: 14px 50px; font-size: 16px; border-radius: 25px;">Continue</button>
        </form>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="#"><img src="{{ url_for('static', filename='home.png') }}" alt="Home" class="nav-icon"></a>
            <a href="#"><img src="{{ url_for('static', filename='user-3.png') }}" alt="Profile" class="nav-icon"></a>
            <a href="#"><img src="{{ url_for('static', filename='hat-chef.png') }}" alt="Chef" class="nav-icon"></a>
        </div>

    </div>

    <!-- JavaScript to handle snap-scroll highlighting and selection -->
    <script>
        const wheel = document.getElementById('ageWheel');
        const items = wheel.querySelectorAll('.picker-item');
        const hiddenInput = document.getElementById('selectedAgeInput');

        wheel.addEventListener('scroll', () => {
            const wheelRect = wheel.getBoundingClientRect();
            const wheelCenter = wheelRect.top + wheelRect.height / 2;

            let closestItem = null;
            let minDistance = Infinity;

            items.forEach(item => {
                const itemRect = item.getBoundingClientRect();
                const itemCenter = itemRect.top + itemRect.height / 2;
                const distance = Math.abs(wheelCenter - itemCenter);

                if (distance < minDistance) {
                    minDistance = distance;
                    closestItem = item;
                }
            });

            if (closestItem) {
                items.forEach(i => i.classList.remove('active'));
                closestItem.classList.add('active');
                hiddenInput.value = closestItem.getAttribute('data-value');
            }
        });

        window.addEventListener('load', () => {
            const defaultItem = wheel.querySelector('[data-value="19"]');
            if (defaultItem) {
                wheel.scrollTop = defaultItem.offsetTop - wheel.clientHeight / 2 + defaultItem.clientHeight / 2;
            }
        });
    </script>

</body>
</html>
