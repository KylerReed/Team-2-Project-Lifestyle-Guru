<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker - User Profile</title>
</head>

<body>

    <h1>Calorie Tracker</h1>
    <h2>User Profile</h2>

    <form method="POST">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" required>

        <br><br>

        <label for="height">Height (inches):</label>
        <input type="number" id="height" name="height" min="1" required>

        <br><br>

        <label for="weight">Weight (pounds):</label>
        <input type="number" id="weight" name="weight" min="1" required>

        <br><br>

        <label for="activity_level">Activity Level:</label>
        <select id="activity_level" name="activity_level" required>
            <option value="">Select activity level</option>
            <option value="Sedentary">Sedentary</option>
            <option value="Light">Lightly Active</option>
            <option value="Moderate">Moderately Active</option>
            <option value="Active">Active</option>
        </select>

        <br><br>

        <label for="calorie_goal">Daily Calorie Goal:</label>
        <input type="number" id="calorie_goal" name="calorie_goal" min="1" required>

        <br><br>

        <button type="submit">Save Profile</button>

    </form>

    {% if message %}
    <p>{{ message }}</p>
    {% endif %}

</body>

</html>
